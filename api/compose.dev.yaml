version: '3'

networks:
  rivero:
    driver: bridge

volumes:
  pg-data:

services:
  api:
    container_name: api
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - ./src:/usr/src/app/src
      - ./.env:/usr/src/app/.env
    ports:
      - "3030:3030"
    networks:
      - rivero
    depends_on:
      - db

  db:
    image: postgres:latest
    container_name: riverodb
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    ports:
      - '${FORWARD_DB_PORT:-5433}:5432'
    networks:
      - rivero
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD
        - pg_isready
        - '-q'
        - '-d'
        - '${DATABASE_NAME}'
        - '-U'
        - '${DATABASE_USERNAME}'
      retries: 3
      timeout: 5s

  maildev:
    container_name: maildev
    image: maildev/maildev
    ports:
      - 1080:1080
      - 1025:1025
    networks:
      - rivero
